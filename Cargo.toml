# The suite's Rust helpers. Apps take them as a git dependency at a release tag:
#   uwu-macos = { git = "https://github.com/MinifyX/UwUSuite-Design", tag = "v1.7.1" }
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.7.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/MinifyX/UwUSuite-Design"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
